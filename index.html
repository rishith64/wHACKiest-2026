<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="UniQuest - Find internships, scholarships, and regional notes. Never miss a deadline." />
    
    <!-- PWA Manifest & Apple Touch -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UniQuest" />

    <title>UniQuest - UnlockED Opportunities</title>
  </head>
  <body class="bg-black text-zinc-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('UniQuest SW registered: ', registration.scope);
            },
            (err) => {
              console.log('UniQuest SW registration failed: ', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
